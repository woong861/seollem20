<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>설렘,스물 — 프로필 도착 💌</title>
<meta property="og:title" content="설렘,스물 ♡ 프로필 도착 💌">
<meta property="og:description" content="소개해드리고 싶은 분이 있어요. 탭해서 확인해보세요 :)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="설렘,스물">
<meta property="og:url" content="https://twentys.co.kr/match.html">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#FF6B9D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink:#FF6B9D; --pink-light:#FFB3CC; --pink-pale:#FFF0F5;
    --purple:#8B5CF6; --purple-light:#C4B5FD; --purple-pale:#F5F3FF;
    --cream:#FFFBF4; --bg:#FFF8FC;
    --text:#1C0A16; --text-muted:#9B6B80;
    --border:rgba(255,107,157,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }

  body {
    font-family: 'Gowun Dodum', sans-serif;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,107,157,0.10) 0%, transparent 50%),
      radial-gradient(circle at 80% 60%, rgba(139,92,246,0.10) 0%, transparent 50%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 15% 20%, rgba(255,107,157,0.4), transparent),
      radial-gradient(1.5px 1.5px at 75% 15%, rgba(139,92,246,0.3), transparent),
      radial-gradient(2px 2px at 35% 75%, rgba(255,107,157,0.3), transparent),
      radial-gradient(1px 1px at 85% 45%, rgba(255,107,157,0.4), transparent),
      radial-gradient(1.5px 1.5px at 25% 50%, rgba(139,92,246,0.25), transparent),
      radial-gradient(1px 1px at 65% 85%, rgba(255,107,157,0.3), transparent);
    background-size: 400px 400px;
    pointer-events: none;
    animation: twinkle 5s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.9; }
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 50px 20px 60px;
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .hero { text-align: center; margin-bottom: 28px; }

  .eyebrow {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .eyebrow .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--pink);
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .title {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(36px, 10vw, 50px);
    font-weight: 600;
    line-height: 1.2;
    background: linear-gradient(135deg, #FF6B9D 0%, #8B5CF6 60%, #FB7185 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
  }

  /* Sealed envelope (initial state) */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
  }

  .envelope {
    position: relative;
    width: 280px;
    height: 200px;
    cursor: pointer;
    transition: transform 0.3s ease;
    animation: floatY 3s ease-in-out infinite;
    filter: drop-shadow(0 12px 32px rgba(255, 107, 157, 0.25));
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .envelope:hover { transform: scale(1.03); }
  .envelope:active { transform: scale(0.97); }

  .env-body {
    position: absolute;
    inset: 0;
    background: var(--cream);
    border: 1.5px solid rgba(255,107,157,0.25);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
  }
  .env-flap {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 110px;
    background: linear-gradient(180deg, #FFF5FA 0%, var(--cream) 100%);
    clip-path: polygon(0 0, 100% 0, 50% 90%);
    border-bottom: 1.5px solid rgba(255,107,157,0.18);
  }
  .wax-seal {
    position: absolute;
    top: 65px;
    left: 50%;
    transform: translateX(-50%);
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 30px;
    font-family: 'Noto Serif KR', serif;
    font-weight: 600;
    box-shadow:
      0 4px 14px rgba(255,107,157,0.4),
      inset 0 -3px 6px rgba(0,0,0,0.1),
      inset 0 3px 6px rgba(255,255,255,0.2);
    z-index: 2;
  }
  .env-to {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Noto Serif KR', serif;
    font-size: 17px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }
  .env-to strong {
    font-weight: 600;
    color: var(--pink);
    margin-left: 4px;
  }

  .tap-hint {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 15px;
    color: var(--text-muted);
    text-align: center;
    animation: hintPulse 1.6s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.04); }
  }

  /* Reveal card */
  .reveal-card {
    display: none;
    background: var(--cream);
    width: 100%;
    max-width: 400px;
    padding: 36px 26px 28px;
    border-radius: 18px;
    box-shadow:
      0 24px 60px rgba(255,107,157,0.20),
      0 8px 20px rgba(139,92,246,0.10);
    position: relative;
    color: var(--text);
    text-align: center;
    margin: 0 auto;
    border: 1px solid var(--border);
  }

  .reveal-card.active {
    display: block;
    animation: bloom 0.85s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes bloom {
    0%   { opacity: 0; transform: scale(0.4) rotate(-8deg); }
    60%  { transform: scale(1.04) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }

  .reveal-card::before {
    content: '';
    position: absolute;
    top: -14px;
    left: 50%;
    width: 80px;
    height: 24px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border-radius: 12px;
    transform: translateX(-50%);
    box-shadow: 0 4px 10px rgba(255,107,157,0.3);
  }

  .heart-big {
    font-size: 52px;
    animation: heartPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s backwards;
  }
  @keyframes heartPop {
    from { transform: scale(0); }
    to   { transform: scale(1); }
  }

  .label {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .match-name {
    font-family: 'Noto Serif KR', serif;
    font-size: 36px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 6px 0 4px;
    word-break: keep-all;
    letter-spacing: -0.5px;
  }

  .meta-row {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 13.5px;
    color: var(--text-muted);
    margin-bottom: 16px;
    line-height: 1.6;
  }
  .meta-row .sep { margin: 0 6px; opacity: 0.5; }
  .meta-row:empty { display: none; }

  .intro {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 15px;
    color: #4a3340;
    line-height: 1.7;
    background: var(--pink-pale);
    padding: 16px 18px;
    border-radius: 14px;
    margin: 8px 0 18px;
    position: relative;
    text-align: left;
    border: 1px solid var(--border);
  }

  .intro::before {
    content: '"';
    font-family: 'Noto Serif KR', serif;
    font-size: 32px;
    color: var(--pink);
    position: absolute;
    top: 2px;
    left: 10px;
    line-height: 1;
    opacity: 0.6;
  }

  .intro::after {
    content: '"';
    font-family: 'Noto Serif KR', serif;
    font-size: 32px;
    color: var(--purple);
    position: absolute;
    bottom: -8px;
    right: 10px;
    line-height: 1;
    opacity: 0.6;
  }

  .intro-text {
    padding: 0 14px;
    display: inline-block;
  }

  /* Consent section */
  .consent-section {
    margin-top: 8px;
    padding-top: 18px;
    border-top: 1px dashed var(--border);
  }
  .consent-prompt {
    font-family: 'Noto Serif KR', serif;
    font-size: 15.5px;
    color: var(--text);
    font-weight: 500;
    margin-bottom: 6px;
  }
  .consent-sub {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 12.5px;
    color: var(--text-muted);
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .consent-buttons {
    display: flex;
    gap: 10px;
  }
  .consent-btn {
    flex: 1;
    padding: 14px 8px;
    border-radius: 50px;
    border: 1.5px solid transparent;
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1.2;
  }
  .consent-btn.yes {
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: white;
    box-shadow: 0 6px 18px rgba(255,107,157,0.32);
  }
  .consent-btn.yes:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(255,107,157,0.42); }
  .consent-btn.no {
    background: white;
    color: var(--text-muted);
    border-color: var(--border);
  }
  .consent-btn.no:hover { background: var(--bg); border-color: var(--pink-light); color: var(--pink); }

  /* Response result */
  .response-result {
    display: none;
    margin-top: 8px;
    padding: 22px 16px 14px;
    border-top: 1px dashed var(--border);
    animation: fadeIn 0.5s ease;
  }
  .response-result.show { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .response-icon {
    font-size: 44px;
    margin-bottom: 8px;
    animation: heartPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .response-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--pink);
    margin-bottom: 10px;
  }
  .response-title.no-style { color: var(--text-muted); }
  .response-text {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 14px;
    color: var(--text);
    line-height: 1.7;
    margin-bottom: 16px;
  }
  .response-text b {
    color: var(--pink);
    background: var(--pink-pale);
    padding: 2px 8px;
    border-radius: 50px;
    font-weight: 600;
    white-space: nowrap;
    display: inline-block;
  }
  .response-text.no-style b { color: var(--text-muted); background: var(--bg); }
  .redo-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 50px;
    padding: 7px 16px;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .redo-btn:hover { background: var(--bg); border-color: var(--pink-light); color: var(--pink); }

  .footer-note {
    text-align: center;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 30px;
    opacity: 0.85;
  }
  .footer-note .brand {
    font-family: 'Noto Serif KR', serif;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 600;
  }

  /* Error state */
  .error-card {
    display: none;
    background: var(--cream);
    padding: 40px 28px;
    border-radius: 18px;
    text-align: center;
    color: var(--text);
    max-width: 380px;
    margin: 0 auto;
    border: 1px solid var(--border);
    box-shadow: 0 12px 32px rgba(255,107,157,0.12);
  }
  .error-card.active { display: block; }
  .error-card .icon { font-size: 52px; margin-bottom: 14px; }
  .error-card h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    color: var(--pink);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .error-card p {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* Multi-profile view */
  .multi-container {
    display: none;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
  }
  .multi-container.active {
    display: block;
    animation: bloom 0.85s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .multi-header {
    text-align: center;
    margin-bottom: 22px;
  }
  .multi-header .heart-big {
    font-size: 44px;
    margin-bottom: 8px;
    animation: heartPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s backwards;
  }
  .multi-header h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .multi-header p {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
  }
  .profile-mini {
    background: var(--cream);
    border-radius: 18px;
    padding: 24px 20px 18px;
    margin-bottom: 16px;
    border: 2px solid var(--border);
    box-shadow: 0 8px 24px rgba(255,107,157,0.10);
    position: relative;
    transition: all 0.3s;
  }
  .profile-mini.liked {
    border-color: var(--pink);
    box-shadow: 0 10px 28px rgba(255,107,157,0.30);
  }
  .profile-mini.skipped {
    opacity: 0.5;
  }
  .profile-mini-num {
    position: absolute;
    top: -11px;
    left: 16px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: white;
    font-family: 'Noto Serif KR', serif;
    font-weight: 600;
    font-size: 13px;
    padding: 4px 14px;
    border-radius: 50px;
    box-shadow: 0 4px 12px rgba(255,107,157,0.35);
    letter-spacing: 0.5px;
  }
  .profile-mini-meta {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 13.5px;
    color: var(--text-muted);
    margin-bottom: 12px;
    line-height: 1.5;
    text-align: center;
    word-break: keep-all;
  }
  .profile-mini-meta .sep { margin: 0 6px; opacity: 0.5; }
  .profile-mini-intro {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 14px;
    color: #4a3340;
    line-height: 1.65;
    background: var(--pink-pale);
    padding: 12px 14px;
    border-radius: 12px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .profile-mini-buttons {
    display: flex;
    gap: 8px;
  }
  .mini-btn {
    flex: 1;
    padding: 11px;
    border-radius: 50px;
    border: 1.5px solid transparent;
    font-family: 'Noto Serif KR', serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mini-btn.yes {
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: white;
    box-shadow: 0 4px 12px rgba(255,107,157,0.25);
  }
  .mini-btn.yes:hover { transform: translateY(-1px); }
  .mini-btn.no {
    background: white;
    color: var(--text-muted);
    border-color: var(--border);
  }
  .mini-btn.no:hover { background: var(--bg); border-color: var(--pink-light); color: var(--pink); }
  .mini-btn.selected {
    background: linear-gradient(135deg, #6dcc7a, #4ade80);
    color: white;
    border: none;
    font-weight: 600;
    cursor: default;
  }
  .mini-btn.skipped-state {
    background: #F3F4F6;
    color: #6B7280;
    border: 1.5px solid #D1D5DB;
    font-weight: 500;
    cursor: default;
  }
  .mini-btn.undo {
    background: none;
    color: var(--text-muted);
    border: 1px solid var(--border);
    font-size: 12px;
    flex: 0 0 auto;
    padding: 9px 14px;
  }
  .mini-btn.undo:hover { color: var(--pink); border-color: var(--pink-light); }

  .multi-summary {
    background: white;
    border: 1.5px dashed var(--pink-light);
    border-radius: 16px;
    padding: 18px 18px 16px;
    margin-top: 14px;
    text-align: center;
  }
  .multi-summary h3 {
    font-family: 'Noto Serif KR', serif;
    font-size: 15.5px;
    font-weight: 600;
    color: var(--pink);
    margin-bottom: 10px;
  }
  .multi-summary p {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .multi-summary .picks {
    margin-top: 4px;
    min-height: 22px;
  }
  .pick-pill {
    display: inline-block;
    margin: 3px;
    padding: 4px 12px;
    border-radius: 50px;
    background: linear-gradient(135deg, var(--pink-pale), #FFE4F0);
    color: var(--pink);
    font-weight: 600;
    font-size: 13px;
    border: 1px solid var(--pink-light);
  }
  .picks-empty {
    color: var(--text-muted);
    font-size: 13px;
    font-style: italic;
  }

  /* Confetti */
  .confetti {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    font-size: 22px;
    animation: confettiFall 2.8s linear forwards;
  }

  @keyframes confettiFall {
    0%   { transform: translate(var(--start-x), -20px) rotate(0); opacity: 1; }
    100% { transform: translate(var(--end-x), 110vh) rotate(720deg); opacity: 0; }
  }

  /* 응답 전송 toast (멀티 모드 pickProfile 피드백) */
  .pick-toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(28,10,22,0.92);
    color: white;
    padding: 12px 22px;
    border-radius: 50px;
    font-size: 14px;
    font-family: 'Gowun Dodum', sans-serif;
    box-shadow: 0 8px 24px rgba(255,107,157,0.25);
    opacity: 0;
    pointer-events: none;
    z-index: 1000;
    transition: opacity 0.25s ease-out, transform 0.25s ease-out;
    white-space: nowrap;
  }
  .pick-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .pick-toast.yes {
    background: linear-gradient(135deg, #FF6B9D, #C084FC);
  }
  .pick-toast.no {
    background: rgba(155, 107, 128, 0.92);
  }
</style>
</head>
<body>

<div class="container">
  <div class="hero">
    <p class="eyebrow"><span class="dot"></span>설렘,스물 ♡ 프로필 도착</p>
    <h1 class="title">프로필 도착</h1>
  </div>

  <div class="stage" id="stage">
    <div class="envelope" onclick="reveal()">
      <div class="env-body">
        <div class="env-to">to. <strong>당신</strong></div>
      </div>
      <div class="env-flap"></div>
      <div class="wax-seal">💌</div>
    </div>
    <p class="tap-hint">👆 탭해서 펼쳐보세요</p>
  </div>

  <div class="reveal-card" id="revealCard">
    <div class="heart-big">💝</div>
    <div class="label">소개해드리고 싶은 분이에요</div>
    <div class="meta-row" id="matchMeta"></div>
    <div class="intro" id="matchIntro" style="display:none"><span class="intro-text" id="matchIntroText"></span></div>

    <div class="consent-section" id="consentSection">
      <p class="consent-prompt">이분과 매칭 진행할까요?</p>
      <p class="consent-sub">아래 버튼으로 선택해주세요 :)</p>
      <div class="consent-buttons">
        <button class="consent-btn yes" onclick="respond('yes')">💝 좋아요!</button>
        <button class="consent-btn no" onclick="respond('no')">🌸 다음에</button>
      </div>
    </div>

    <div class="response-result" id="responseResult">
      <div class="response-icon" id="responseIcon">💝</div>
      <div class="response-title" id="responseTitle"></div>
      <div class="response-text" id="responseText"></div>
      <button class="redo-btn" onclick="resetResponse()">↻ 다시 선택</button>
    </div>
  </div>

  <div class="pick-toast" id="pickToast"></div>

  <div class="multi-container" id="multiContainer">
    <div class="multi-header">
      <div class="heart-big">💝</div>
      <h2 id="multiTitle">후보 프로필이 도착했어요</h2>
      <p>마음에 드시는 분을 선택해주세요 :)</p>
    </div>
    <div id="profileList"></div>
    <div class="multi-summary">
      <h3>🌸 선택 진행 상황</h3>
      <p>좋아요한 후보의 응답을 기다리고 있어요<br>양쪽 모두 좋아요면 카톡방을 열어드릴게요</p>
      <div class="picks" id="multiPicks"><span class="picks-empty">아직 선택하지 않으셨어요</span></div>
    </div>
  </div>

  <div class="error-card" id="errorCard">
    <div class="icon">😢</div>
    <h2>프로필을 찾을 수 없어요</h2>
    <p>링크가 잘못되었거나 만료되었어요.<br>운영진에게 문의해주세요.</p>
  </div>

  <p class="footer-note" id="footerNote" style="display:none"><span class="brand">설렘,스물</span>에서 좋은 인연이 시작되길 ♡</p>
</div>

function decode(str) {
  // 새 형식 (LZString 압축) 먼저 시도 — object 또는 array 둘 다 허용
  try {
    const json = LZString.decompressFromEncodedURIComponent(str);
    if (json) {
      const parsed = JSON.parse(json);
      if (parsed) return parsed;
    }
  } catch (e) {}
  // 구 형식 (base64) 폴백
  try {
    let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const binary = atob(b64);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    const json = new TextDecoder().decode(bytes);
    return JSON.parse(json);
  } catch (e) { return null; }
}

// Google Apps Script 백엔드 — 응답 자동 수집
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxjgzRGnvS50TOIauHSdQgQyStjw9zdDVHuWfzhrNXmL6ZiHMJDmy_vRorIQMHMoWy-/exec';

function postToBackend(data) {
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify(data),
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  }).catch(e => console.warn('Backend POST failed:', e));
}

const params = new URLSearchParams(location.search);
const p = params.get('p');
const matchId = params.get('m') || null;    // 매칭 ID (운영자 매칭 생성 시 부여)
const candNum = params.get('c') || null;    // 후보 번호 (있으면 = 후보가 보는 화면)
const maxLikes = parseInt(params.get('n') || '1', 10);  // 받는 분이 좋아요 가능한 최대 인원
const isCandidate = !!candNum;               // c 있음 = 후보 / 없음 = 받는 분
let matchData = p ? decode(p) : null;

// 이름은 의도적으로 URL에 포함 안 함 — meta(학교/학과)나 intro로 페이로드 유효성 판단
// matchData는 단일 프로필 object 또는 array (여러 후보) 가능
function validProfile(p) { return p && (p.s || p.i || p.b); }
function validData(d) {
  if (Array.isArray(d)) return d.length > 0 && d.every(validProfile);
  return validProfile(d);
}
function showError() {
  document.getElementById('stage').style.display = 'none';
  document.getElementById('errorCard').classList.add('active');
  matchData = null;
}
function parseSavedStatus(s) {
  s = String(s || '');
  if (!s || s === '대기') return {};
  var out = {};
  s.split(',').forEach(function(pt) {
    var mm = pt.match(/^c(\d+):(yes|no)$/);
    if (mm) out[parseInt(mm[1], 10)] = mm[2];
  });
  return out;
}
window.__savedResponses = {};

if (!matchData && matchId && !p) {
  // 백엔드에서 matchId로 후보 조회 (URL 축소 방식)
  fetch(APPS_SCRIPT_URL + '?mid=' + encodeURIComponent(matchId))
    .then(r => r.json())
    .then(data => {
      if (data && data.p) {
        try { matchData = decode(data.p); } catch(e) {}
      }
      if (data && typeof data.n === 'number') window.__fetchedMaxLikes = data.n;
      if (data && data.status) window.__savedResponses = parseSavedStatus(data.status);
      if (!matchData || !validData(matchData)) showError();
    })
    .catch(() => showError());
} else if (!matchData || !validData(matchData)) {
  showError();
}

function reveal() {
  if (!matchData) return;
  document.getElementById('stage').style.display = 'none';

  // Array면 multi 뷰, object면 single 뷰
  if (Array.isArray(matchData)) {
    renderMulti(matchData);
  } else {
    renderSingle(matchData);
  }

  document.getElementById('footerNote').style.display = 'block';
  setTimeout(launchConfetti, 250);
}

function renderSingle(p) {
  const metaParts = [];
  if (p.s) metaParts.push('🏫 ' + p.s);
  if (p.i) metaParts.push(p.i);
  if (metaParts.length) {
    document.getElementById('matchMeta').innerHTML = metaParts.join('<span class="sep">·</span>');
  }

  if (p.b) {
    document.getElementById('matchIntro').style.display = 'block';
    document.getElementById('matchIntroText').textContent = p.b;
  }

  document.getElementById('revealCard').classList.add('active');
}

const multiState = {}; // {1: 'yes', 2: 'no', ...}

function renderMulti(profiles) {
  const titleText = maxLikes >= profiles.length
    ? profiles.length + '명의 후보를 만나보세요'
    : profiles.length + '명 중 ' + maxLikes + '명까지 선택 가능';
  document.getElementById('multiTitle').textContent = titleText;
  const list = document.getElementById('profileList');
  list.innerHTML = '';
  profiles.forEach((p, idx) => {
    list.appendChild(buildMiniCard(p, idx + 1));
  });
  document.getElementById('multiContainer').classList.add('active');
  updateMultiPicks();  // 초기 카운터 표시
}

function buildMiniCard(p, num) {
  const card = document.createElement('div');
  card.className = 'profile-mini';
  card.id = 'pmini' + num;

  const metaParts = [];
  if (p.s) metaParts.push('🏫 ' + escH(p.s));
  if (p.i) metaParts.push(escH(p.i));
  const metaHtml = metaParts.length ? metaParts.join('<span class="sep">·</span>') : '';

  const introHtml = p.b ? '<div class="profile-mini-intro">' + escH(p.b) + '</div>' : '';

  // 이미 응답한 후보면 disabled 상태 표시
  var savedChoice = window.__savedResponses && window.__savedResponses[num];
  var btnsHtml;
  if (savedChoice === 'yes') {
    card.classList.add('liked');
    btnsHtml = '<div class="profile-mini-buttons" id="pbtns' + num + '">' +
      '  <button class="mini-btn selected" disabled>✓ 좋아요 응답 완료</button>' +
      '</div>';
    multiState[num] = 'yes';
  } else if (savedChoice === 'no') {
    card.classList.add('skipped');
    btnsHtml = '<div class="profile-mini-buttons" id="pbtns' + num + '">' +
      '  <button class="mini-btn skipped-state" disabled>✓ 다음에 응답 완료</button>' +
      '</div>';
    multiState[num] = 'no';
  } else {
    btnsHtml = '<div class="profile-mini-buttons" id="pbtns' + num + '">' +
      '  <button class="mini-btn yes" onclick="pickProfile(' + num + ', \'yes\')">💝 좋아요</button>' +
      '  <button class="mini-btn no" onclick="pickProfile(' + num + ', \'no\')">🌸 다음에</button>' +
      '</div>';
  }

  card.innerHTML =
    '<div class="profile-mini-num">후보 ' + num + '번</div>' +
    (metaHtml ? '<div class="profile-mini-meta">' + metaHtml + '</div>' : '') +
    introHtml +
    btnsHtml;

  return card;
}

function showPickToast(num, choice) {
  const toast = document.getElementById('pickToast');
  if (!toast) return;
  toast.classList.remove('yes', 'no');
  toast.classList.add(choice === 'yes' ? 'yes' : 'no');
  toast.textContent = (choice === 'yes' ? '💝 ' : '🌸 ') + num + '번 ' + (choice === 'yes' ? '좋아요 전송됨' : '다음에 전송됨');
  // 강제 reflow → 애니메이션 트리거
  void toast.offsetWidth;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 1800);
}

function pickProfile(num, choice) {
  // 좋아요 한도 체크 — 최대치 도달했고 새로 좋아요면 차단
  if (choice === 'yes' && multiState[num] !== 'yes') {
    const currentLikes = Object.values(multiState).filter(v => v === 'yes').length;
    if (currentLikes >= maxLikes) {
      alert('좋아요는 최대 ' + maxLikes + '명까지 가능해요.\n다른 후보 선택을 취소(↻ 다시)하시면 추가 선택 가능합니다.');
      return;
    }
  }

  // 백엔드에 응답 전송 (멀티 모드 = 받는 분 응답)
  if (matchId) {
    postToBackend({
      type: 'response',
      matchId,
      role: 'recipient',
      candidateNum: num,
      choice
    });
  }
  showPickToast(num, choice);

  multiState[num] = choice;
  const card = document.getElementById('pmini' + num);
  if (choice === 'yes') {
    card.classList.add('liked');
    card.classList.remove('skipped');
  } else {
    card.classList.add('skipped');
    card.classList.remove('liked');
  }
  const btns = document.getElementById('pbtns' + num);
  const stateClass = choice === 'yes' ? 'selected' : 'skipped-state';
  const stateLabel = choice === 'yes' ? '✓ 좋아요' : '✓ 다음에';
  btns.innerHTML =
    '<button class="mini-btn ' + stateClass + '">' + stateLabel + '</button>' +
    '<button class="mini-btn undo" onclick="resetPick(' + num + ')">↻ 다시</button>';
  updateMultiPicks();
}

function resetPick(num) {
  delete multiState[num];
  const card = document.getElementById('pmini' + num);
  card.classList.remove('liked', 'skipped');
  const btns = document.getElementById('pbtns' + num);
  btns.innerHTML =
    '<button class="mini-btn yes" onclick="pickProfile(' + num + ', \'yes\')">💝 좋아요</button>' +
    '<button class="mini-btn no" onclick="pickProfile(' + num + ', \'no\')">🌸 다음에</button>';
  updateMultiPicks();
}

function updateMultiPicks() {
  const picks = document.getElementById('multiPicks');
  const liked = Object.keys(multiState).filter(k => multiState[k] === 'yes').sort((a, b) => +a - +b);
  let html = '';
  if (liked.length === 0) {
    html = '<span class="picks-empty">아직 선택하지 않으셨어요 (' + liked.length + '/' + maxLikes + ')</span>';
  } else {
    html = liked.map(n => '<span class="pick-pill">💝 ' + n + '번</span>').join('') +
      ' <span class="picks-empty" style="margin-left:6px">(' + liked.length + '/' + maxLikes + ')</span>';
  }
  picks.innerHTML = html;

  // 한도 도달 시 모든 미선택 카드의 좋아요 버튼 disable
  const atMax = liked.length >= maxLikes;
  document.querySelectorAll('[id^="pmini"]').forEach(card => {
    const num = card.id.replace('pmini', '');
    if (multiState[num]) return; // 이미 선택한 카드는 건너뜀
    const yesBtn = card.querySelector('.mini-btn.yes');
    if (yesBtn) {
      yesBtn.disabled = atMax;
      yesBtn.style.opacity = atMax ? '0.4' : '';
      yesBtn.style.cursor = atMax ? 'not-allowed' : '';
      yesBtn.title = atMax ? '좋아요 한도(' + maxLikes + '명) 도달' : '';
    }
  });
}

function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function respond(choice) {
  // 백엔드에 응답 전송 (fire-and-forget)
  if (matchId) {
    postToBackend({
      type: 'response',
      matchId,
      role: isCandidate ? 'candidate' : 'recipient',
      candidateNum: candNum || 1,  // 후보면 자기 번호, 받는 분의 단일 프로필 모드면 1
      choice
    });
  }

  document.getElementById('consentSection').style.display = 'none';
  const result = document.getElementById('responseResult');
  result.classList.add('show');

  const icon = document.getElementById('responseIcon');
  const title = document.getElementById('responseTitle');
  const text = document.getElementById('responseText');

  if (choice === 'yes') {
    icon.textContent = '💝';
    title.textContent = '좋아요를 선택하셨어요!';
    title.classList.remove('no-style');
    text.classList.remove('no-style');
    text.innerHTML = '응답이 운영진에게 전달됐어요 ✓<br>상대방 동의도 확인되면 카톡방을 열어드릴게요 :)';
  } else {
    icon.textContent = '🌸';
    title.textContent = '다음 인연을 기다려요';
    title.classList.add('no-style');
    text.classList.add('no-style');
    text.innerHTML = '응답이 운영진에게 전달됐어요 ✓<br>다음에 더 잘 맞는 인연으로 안내드릴게요.';
  }
}

function resetResponse() {
  document.getElementById('responseResult').classList.remove('show');
  document.getElementById('consentSection').style.display = 'block';
}

function launchConfetti() {
  const emojis = ['💖', '✨', '🌸', '💕', '⭐', '💝', '🌷'];
  for (let i = 0; i < 22; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const startX = Math.random() * 100;
    const drift = (Math.random() - 0.5) * 40;
    c.style.left = startX + 'vw';
    c.style.top = '0';
    c.style.setProperty('--start-x', '0vw');
    c.style.setProperty('--end-x', drift + 'vw');
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    c.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}
</script>
